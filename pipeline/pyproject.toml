[project]
name = "fitnessapp-pipeline"
version = "2.0.0"
description = "Productor y consumidor de Kafka que cargan el catálogo de calorías en MongoDB"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.11",
    "pymongo>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
