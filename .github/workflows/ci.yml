# Se ejecuta en cada push y pull request: lint + tests de los dos proyectos + build de imágenes
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, pipeline]
    # Los tests usan un MongoDB real y desechable
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGO_TEST_URI: mongodb://localhost:27017/${{ matrix.project }}_test
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile -t fitnessapp-web .
      - run: docker build -f pipeline/Dockerfile -t fitnessapp-pipeline .
