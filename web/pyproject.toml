[project]
name = "fitnessapp-web"
version = "2.0.0"
description = "FitnessApp: catálogo de calorías, dietas y buscador de gimnasios (Flask)"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "flask-wtf>=1.2",
    "authlib>=1.6",
    "pymongo>=4.13",
    "requests>=2.32",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
